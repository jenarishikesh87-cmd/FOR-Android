name: Build FOR Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Add Android notification permissions and icon
        run: node scripts/patch-android.mjs
      - name: Sync native app
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOR-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
